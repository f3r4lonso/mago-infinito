<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mago Infinito - Beta</title>
<style>
:root{--bg:#0b0b14;--p1:#15132b;--p2:#0f0e1d;--line:#2b2850;--acc:#8f7cff;--gold:#ffd24a;--txt:#e8e6f0;--mut:#a9a5c4}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#3a3566 transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Segoe UI,system-ui,sans-serif;overflow:hidden}
body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
#game{overflow:hidden;grid-column:1;grid-row:1;position:relative;min-width:0;min-height:0}
canvas{display:block;touch-action:none}
#tbar{display:none}
.panel{background:linear-gradient(180deg,var(--p1),var(--p2));padding:12px;overflow-y:auto;min-height:0}
#left{grid-column:1;grid-row:1;border-right:1px solid var(--line)}
#info{grid-column:1;grid-row:2;border-right:1px solid var(--line);border-top:1px solid var(--line)}
#shopc{grid-column:3;grid-row:1;border-left:1px solid var(--line)}
#inv{grid-column:3;grid-row:2;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.panel h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.panel h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.panel h3{margin:0 0 2px;font-size:15px}
.sub{font-size:11px;color:var(--mut);line-height:1.4}
.panel p{font-size:12px;color:#c9c5e4;margin:6px 0;line-height:1.45}
.sec{font-size:10px;color:#7d79a0;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.1em}
.hint{font-size:11px;color:#7d79a0;margin-top:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:8px}
.hint b{color:#c9c5e4}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,5,12,.78);backdrop-filter:blur(3px);z-index:6}
#skbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:4;display:flex;align-items:stretch;gap:4px;background:rgba(20,18,40,.8);border:1px solid #3a3566;border-radius:12px;padding:5px 6px;max-width:96%}
#skbar .skauto{background:#2b2338;border:2px solid #6b5420;border-radius:8px;color:#e8e6f0;font:inherit;font-size:10px;font-weight:700;cursor:pointer;padding:0 6px;min-width:48px}
#skbar .skauto.on{border-color:#73bc81;color:#9bff9b}
#skbar{flex-wrap:wrap;justify-content:center}
#skbar .sks{display:grid;grid-template-columns:repeat(12,44px);gap:3px}
#skbar .pws{grid-template-columns:repeat(10,44px)}
#skbar .sksep{flex-basis:100%;height:0}
#skbar .slot{height:54px;padding:0}
#skbar .slot .si{font-size:17px}
#skbar .slot .sl,#skbar .slot .sc{font-size:9px}
@media (max-width:900px){#skbar .sks{grid-template-columns:repeat(6,42px)}#skbar .pws{grid-template-columns:repeat(5,42px)}}
#roundbar{position:absolute;left:50%;top:72px;transform:translateX(-50%);display:none;z-index:5;background:rgba(20,18,40,.95);border:1px solid #3a3566;border-radius:14px;padding:12px 20px;text-align:center;max-width:460px;width:90%;box-shadow:0 10px 30px #000a}
.card{background:linear-gradient(180deg,#1b1838,#141228);border:1px solid #3a3566;border-radius:16px;padding:22px 26px;max-width:560px;width:92%;box-shadow:0 14px 50px #000b;max-height:92vh;overflow:auto}
.card h1{margin:0 0 4px;font-size:24px}
.card p{margin:0 0 14px;color:var(--mut)}
.btn{background:linear-gradient(180deg,#7a5cff,#5a3fe0);border:0;color:#fff;font:inherit;font-weight:700;padding:10px 22px;border-radius:10px;cursor:pointer;margin-top:10px;box-shadow:0 3px 0 #3a26a8}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3a26a8}
.btn.sm{padding:5px 10px;margin:0;font-size:12px;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:#2b2850;box-shadow:0 3px 0 #1a1838}
input[type=text]{background:#0f0e1c;border:1px solid #3a3566;color:#fff;font:inherit;padding:8px 10px;border-radius:8px;width:200px}
table.rank{width:100%;border-collapse:collapse;font-size:13px;text-align:left}
table.rank td,table.rank th{padding:3px 6px;border-bottom:1px solid var(--line)}
table.rank tr.me td{background:#2a2450;color:var(--gold)}
.heroes{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.hcard{background:#1a1832;border:2px solid #2f2b57;border-radius:12px;padding:6px;cursor:pointer;transition:transform .12s,border-color .12s}
.hcard:hover{transform:translateY(-3px)}
.hcard.on{border-color:var(--gold);box-shadow:0 0 16px #ffd24a44}
.hcard canvas{width:100%;height:auto;display:block}
.hcard b{font-size:13px}
body.start-screen #bottomp,body.start-screen #tbar,body.start-screen #soloBar{display:none!important}
body.start-screen #game{bottom:0}
body.start-screen #overlay{padding:16px;align-items:center}
.start-card{max-width:1120px;width:100%;max-height:100%;padding:22px;overscroll-behavior:contain}
.start-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.start-head p{margin:4px 0 0;font-size:13px}
.start-section{margin:18px 0}.start-section h2{font-size:14px;margin:0 0 10px;color:#d6cef5}
.start-modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.start-mode,.map-choice{font:inherit;color:inherit;text-align:left;background:#131126;border:2px solid #36305c;border-radius:12px;cursor:pointer;padding:12px;min-width:0}
.start-mode strong,.start-mode small{display:block}.start-mode strong{font-size:14px}.start-mode small{color:var(--mut);font-size:12px;line-height:1.4;margin-top:5px}
.start-mode.on,.map-choice.on{border-color:var(--gold);background:#29213c}
.start-mode:focus-visible,.map-choice:focus-visible,.hcard:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.start-maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.map-choice{padding:0;overflow:hidden;position:relative}.map-choice picture{display:block}.map-choice img{display:block;width:100%;height:120px;object-fit:cover}
.map-choice span{display:block;padding:8px 12px;font-size:13px;font-weight:700}.map-choice.on span::after{content:' ✓';color:var(--gold)}
.party-slots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.party-slot{font-size:12px;padding:7px 10px;border:1px solid #66522e;border-radius:8px;background:#29213c}.party-slot.empty{color:var(--mut);border-style:dashed}
.start-card .heroes{grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.start-card .hcard{font:inherit;color:inherit;position:relative;min-width:0;text-align:center;padding:5px;touch-action:manipulation}
.start-card .hcard b{display:block;font-size:11px;line-height:1.25;min-height:28px}.start-card .hcard canvas{max-height:115px;object-fit:contain;touch-action:pan-y}
.hn{position:absolute;top:5px;right:6px;font-style:normal;font-size:12px;font-weight:700;color:var(--gold)}
#heroDesc{font-size:12px;line-height:1.5;min-height:36px;margin:12px 0;color:var(--mut)}
.start-footer{display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;bottom:-22px;padding:12px 0 4px;background:#141228;border-top:1px solid #36305c;z-index:1}
.start-footer label{font-size:12px;color:var(--mut)}.start-footer input{display:block;width:190px;max-width:100%;margin-top:4px}.start-footer .btn{margin:0;min-height:44px}
.start-action{text-align:right}.start-action small{display:block;color:var(--mut);font-size:11px;margin-bottom:6px}
@media(max-width:700px){
 body.start-screen #overlay{padding:6px;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}
 .start-card{padding:14px 10px;border-radius:12px}.start-card h1{font-size:22px}.start-head{margin-bottom:12px}.start-head .btn{padding:8px;font-size:12px;margin:0}
 .start-section{margin:14px 0}.start-modes{gap:5px}.start-mode{padding:10px 6px;text-align:center;min-height:64px}.start-mode strong{font-size:12px}.start-mode small{font-size:10px}
 .map-choice img{height:82px}.map-choice span{font-size:12px;padding:7px}.start-card .heroes{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
 .start-card .hcard canvas{max-height:88px}.start-card .hcard b{font-size:10px;min-height:26px}.party-slot{padding:6px;font-size:11px}
 .start-footer{bottom:-14px;gap:8px;align-items:flex-end;padding:10px 0 4px}.start-footer label{flex:1;min-width:0}.start-footer input{width:100%;font-size:16px}.start-footer .btn{padding:10px 12px;font-size:13px}.start-action{flex:1}.start-action .btn{width:100%}
}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;background:#1a1832;border:1px solid #2f2b57;border-radius:8px;color:inherit;font:inherit;font-size:12px;padding:6px;cursor:pointer}
.tab.on{border-color:var(--acc);background:#26224a}
.tab.alert::after{content:' ●';color:var(--gold)}
.pts{background:#1a1832;border:1px solid #2f2b57;border-radius:9px;padding:6px 10px;margin-bottom:8px;font-size:13px}
.pts.on{border-color:var(--gold);box-shadow:0 0 12px #ffd24a55;color:var(--gold)}
.srow{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid transparent;border-radius:8px;cursor:pointer;font-size:12px}
.srow:hover{background:#1c1a38}
.srow.sel{border-color:var(--acc);background:#1f1c40}
.srow.dim .nm{opacity:.55}
.srow .nm{flex:1}
.srow .nm small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mut);font-size:10px;line-height:1.3}
.plus.buy{min-width:70px;height:30px;font-size:12px;padding:0 8px}
.srow .lv{color:var(--mut);font-size:11px;min-width:34px;text-align:right}
.plus{min-width:24px;height:24px;border:0;border-radius:6px;background:#2c6b3c;color:#fff;font-weight:700;cursor:pointer;font-size:11px;padding:0 5px}
.plus.gold{background:#7a5a10}
.plus:disabled{background:#26243f;color:#6a6690;cursor:not-allowed}
.item{display:block;width:100%;text-align:left;background:#1a1832;border:1px solid #2f2b57;border-radius:9px;padding:7px 9px;margin-bottom:6px;color:inherit;font:inherit;cursor:pointer}
.item:hover:not(.off){border-color:var(--acc);background:#1f1c40}
.item.off{opacity:.45;cursor:not-allowed}
.item .nm{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.item .co{color:var(--gold);font-weight:700;white-space:nowrap}
.item .ds{font-size:11px;color:var(--mut);margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:1px 0}
.kv b{color:var(--gold);text-align:right}
.bar2{position:relative;height:14px;background:#000a;border:1px solid #ffffff30;border-radius:4px;overflow:hidden;margin:4px 0}
.bar2 i{position:absolute;left:0;top:0;bottom:0;width:0}
.bar2 b{position:absolute;inset:0;font-size:10px;text-align:center;line-height:14px}
.chk{font-size:11px;color:#c9c5e4;display:flex;gap:4px;align-items:center}
.dbtn{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:#1a1832;border:1px solid #2f2b57;border-radius:8px;padding:5px 7px;margin-bottom:4px;color:inherit;font:inherit;cursor:pointer;font-size:12px}
.dbtn:hover:not(:disabled){border-color:var(--acc)}
.dbtn:disabled{opacity:.45;cursor:not-allowed}
.dbtn .dn{flex:1}.dbtn small{display:block;color:var(--mut);font-size:10px}
.dbtn .dc{color:var(--gold);font-size:11px;white-space:nowrap}
/* dragón: ventana flotante */
#drMini{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3}
#drToggle{background:linear-gradient(180deg,#1f1c40,#171532);border:1px solid #3a3566;border-radius:20px;color:inherit;font:inherit;font-size:12px;padding:5px 14px;cursor:pointer}
#drToggle:hover{border-color:var(--acc)}
#drToggle.alert{border-color:var(--gold);box-shadow:0 0 12px #ffd24a66}
#drWin{display:none;position:absolute;top:50px;right:12px;width:330px;max-height:calc(100% - 140px);overflow:auto;z-index:4;background:linear-gradient(180deg,#1b1838,#141228);border:1px solid #3a3566;border-radius:14px;padding:12px;box-shadow:0 10px 40px #000b}
#drWin.open{display:block}
#drWin h2{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--acc);letter-spacing:.1em;text-transform:uppercase}
#drClose{background:transparent;border:0;color:var(--mut);font-size:16px;cursor:pointer}
/* barra de poderes */
#bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;max-width:96%;gap:6px 8px;align-items:flex-end;z-index:2}
.sp{display:flex;flex-direction:column;gap:3px;align-items:stretch;width:64px}
.cast{position:relative;overflow:hidden;height:48px;background:linear-gradient(180deg,#201d42,#16142e);border:1px solid #3a3566;border-radius:10px;color:inherit;font:inherit;cursor:pointer;font-size:22px;line-height:1}
.cast:hover:not(:disabled){border-color:var(--acc)}
.cast:disabled{opacity:.4;cursor:not-allowed;font-size:12px}
.cast .key{position:absolute;top:2px;left:5px;font-size:10px;font-weight:700;color:var(--acc)}
.cast .cdo{position:absolute;left:0;right:0;bottom:0;background:#000b;height:0}
.cast .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;text-shadow:0 0 4px #000}
.cast.ready{border-color:var(--gold);box-shadow:0 0 10px #ffd24a55}
.mode{font:inherit;font-size:10px;font-weight:700;border-radius:6px;border:1px solid #3a3566;background:#11101f;color:var(--mut);padding:2px 0;cursor:pointer}
.mode.auto{background:#2c6b3c;border-color:#4ac26a;color:#e6ffe9}
@media (min-width:901px){#bar{top:64px;bottom:auto;left:auto;right:8px;transform:none;flex-wrap:nowrap;max-width:none;gap:4px}#bar .ctl{height:34px;min-width:34px;font-size:13px}}
.ctl{height:48px;min-width:46px;background:linear-gradient(180deg,#201d42,#16142e);border:1px solid #3a3566;border-radius:10px;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:0 8px}
.ctl:hover{border-color:var(--acc)}
@media(max-width:1100px){.sp{width:56px}.heroes{grid-template-columns:repeat(2,1fr)}}
@media (pointer:coarse){
  .plus{min-width:38px;height:36px;font-size:14px}
  .srow{padding:7px 6px;gap:8px}
  .item{padding:11px 10px}
  .btn{padding:12px 24px}
  .mode{padding:5px 0}
}
@media (max-width:900px){
  html,body{height:100%;overscroll-behavior:none}
  body{display:block}
  #game{position:fixed;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom))}
  .panel{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));max-height:64vh;z-index:8;display:none;border:0;border-top:2px solid var(--acc);border-radius:16px 16px 0 0;box-shadow:0 -12px 30px #000b}
  .panel.open{display:block}
  #left,#info,#shopc,#inv{border:0;border-top:2px solid var(--acc)}
  #tbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:9;background:#0f0e1d;border-top:1px solid var(--line)}
  #tbar button{flex:1;background:none;border:0;color:var(--txt);font:inherit;font-size:20px;line-height:1.1;padding:4px 0}
  #tbar button span{display:block;font-size:10px;color:var(--mut)}
  #tbar button.on{background:#26224a}
  #bar{bottom:6px;gap:4px 5px}
  .sp{width:44px}
  .cast{height:38px;font-size:17px}
  .cast .key{display:none}
  .ctl{height:38px;min-width:36px;padding:0 4px;font-size:13px}
  .mode{font-size:8px}
  .card{padding:16px 14px}
  .heroes{grid-template-columns:repeat(2,1fr)}
  .hint{display:none}
}
#infoInline,.dhead,.bdg{display:none}
@media (max-width:900px){
  #info{display:none !important}
  #infoInline{display:block;background:#1a1832;border:1px solid #2f2b57;border-radius:10px;padding:8px 10px;margin-bottom:10px}
  #infoInline h3{font-size:15px}
  .dhead{display:flex;position:sticky;top:-12px;z-index:3;justify-content:space-between;align-items:center;background:#15132b;padding:6px 0;margin:-4px 0 8px;font-size:12px;color:var(--mut)}
  .dclose{background:#2b2850;border:0;color:#fff;border-radius:8px;width:40px;height:34px;font-size:16px}
  #tbar button{position:relative;font-size:24px}
  #tbar button span{font-size:11px}
  .bdg{position:absolute;top:3px;right:calc(50% - 34px);min-width:20px;height:20px;border-radius:10px;background:#e0503a;color:#fff;font-size:12px;font-style:normal;font-weight:700;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 8px #e0503a}
  #bar{top:auto;right:10px;bottom:8px;left:10px;transform:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:none;gap:4px}
  #bar .sp,#bar .ctl{width:100%;min-width:0}

  .ctl{width:46px;height:46px;min-width:46px;font-size:15px;padding:0;border-radius:12px;background:rgba(21,19,43,.85)}
  .srow{font-size:14px;padding:9px 6px}
  .item .nm{font-size:15px}.item .ds{font-size:12px}
  .panel p{font-size:13px}.kv{font-size:13px}
  .panel{max-height:68vh}
}
@media (max-width:900px){#tbar{display:none}body.resting #tbar{display:flex}#game{bottom:0}body.resting #game{bottom:calc(56px + env(safe-area-inset-bottom))}#bar{bottom:8px}body.resting #bar{bottom:calc(64px + env(safe-area-inset-bottom))}}
@media (pointer:coarse){.plus.buy{min-width:88px;height:42px;font-size:14px}}
#bottomp{grid-column:1;grid-row:2;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px 12px;align-items:start;padding:8px 14px 10px;border-top:3px solid #8a6a2a;background:linear-gradient(180deg,#241d30,#120f1a);box-shadow:0 -6px 18px #000a}
.bsec{min-width:0}
#heroSec,#heroSec2,#heroSec3,#heroSec4{--c:6;grid-column:span 3}#skSec{--c:6;grid-column:span 5}#invSec{--c:8;grid-column:span 7}
#bottomp .slots{grid-template-columns:repeat(var(--c),minmax(0,1fr));grid-auto-rows:70px;gap:4px}
#bottomp .btitle{height:24px;margin:0 0 6px;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:5px;overflow:hidden}
#bottomp .btitle>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bottomp .btitle>span:first-child{flex:1 1 auto}
#bottomp .btitle>.auto-upgrade{flex:0 0 auto;margin-left:auto}
#bottomp .pts{margin:0;padding:1px 7px;font-size:10px;letter-spacing:0;text-transform:none;flex-shrink:0}
#bottomp .chk{white-space:nowrap;font-size:10px}
#heroName,#heroName2{color:#ffe7a8}
#soloResetSkills{display:none}
body.solo #soloResetSkills{display:inline-block;flex:0 0 auto;width:auto;height:22px;min-width:0;font-size:10px;letter-spacing:0;padding:2px 5px}
.slot.lit{border-color:#ffd24a;box-shadow:0 0 8px #ffd24a66,inset 0 0 8px #000a}
.slot-wrap{position:relative;min-width:0;height:100%}
.slot-wrap>.slot{width:100%;height:100%;padding-top:14px}
.auto-upgrade{display:inline-flex;align-items:center;gap:3px;font-size:10px;line-height:15px;letter-spacing:0;text-transform:none;color:#bdb6d9;cursor:pointer;white-space:nowrap}
.auto-upgrade input{appearance:auto;accent-color:#9be88f;width:13px;height:13px;margin:0;cursor:pointer}
.auto-upgrade b{color:#b5f7a5;min-width:9px;font-size:10px}
.slot-wrap>.auto-upgrade{position:absolute;top:3px;left:3px;z-index:3;gap:1px;padding:0 1px;border-radius:3px;background:#171326dc;line-height:12px}
.slot-wrap>.auto-upgrade input{width:11px;height:11px}
.slot-wrap>.auto-upgrade b{font-size:9px}
.slot-wrap .has-auto .power-star{top:20px;right:2px;font-size:10px}
.slot-wrap:has(.auto-upgrade input:checked)>.slot{border-color:#73bc81}
#bottomp .auto-upgrade{max-width:100%}
.power-star{position:absolute;top:1px;right:3px;z-index:1;font-size:13px;line-height:1;color:#8a8995;text-shadow:0 1px 3px #000,0 0 3px #000;pointer-events:none}

const teamLvl=()=>{if(!G)return 1;let m=G.lvl;if(G.hl)G.hl.forEach((h,i)=>{if(i!==HCUR&&h&&h.lvl>m)m=h.lvl});return m};
const powK=()=>1+DIFF.pow*Math.max(0,teamLvl()-10);   /* crecimiento exponencial de la vida enemiga a partir del minuto 5 */
/* A partir del minuto 6 salen menos enemigos pero cada uno es más fuerte (misma dificultad total, menos carga para el equipo) */
const cntF=t=>{const m=eT(t)/60;return m<=6?1:Math.max(.4,1-.6*(m-6)/10)};
const spawnRate=t=>{const m=eT(t)/60;return DIFF.spawn*Math.exp(DIFF.sl*Math.max(0,m-6))*1.25*(1+.12*Math.min(20,Math.max(0,m-3)))*Math.min(12,m<2?.3+.25*m:m<5?.8+.3*(m-2):1.7+.35*Math.pow(m-5,1.15))*cntF(t)};
const hpScale=t=>{const m=eT(t)/60;return DIFF.hp*powK()*Math.exp(DIFF.late*Math.max(0,m-6))*1.25*(m<2?1+.35*m:m<5?1.7+.5*(m-2):3.2*Math.exp(HPK*(m-5)))};

/* Elige objetivos cercanos evitando el overkill */
function pick(n,type,dmg,range,from){
  const fx=from?from.x:ax(),fy=from?from.y:ay(),r2=range*range;
  const c=[];
  for(const e of G.enemies){
    if(e.dead)continue;
    const dd=(e.x-fx)**2+(e.y-fy)**2;
    if(dd>r2)continue;
    const m=mult(e,type);if(m===0)continue;
    if(e.hp-e.pending-dotLeft(e)<=0.5)continue;
    c.push([dd,e]);
  }
  c.sort((a,b)=>a[0]-b[0]);
  return c.slice(0,n).map(a=>a[1]);
}

/* ============ HABILIDADES ============ */
function castSkill(s,lvl){
  const dmg=s.dmg*(BAL[s.id]||1)*DMG_K*skK(lvl)*S.dmg,col=TYPES[s.type].c;
  const f=tf(s.id),n=s.cnt(lvl)+f.cnt;
  if(s.kind==='cyclops')return false;   /* el cíclope es una invocación permanente: la gestiona updateCyclopes */
  if(s.kind==='chain'){
    const red=lvl>=ULT_LVL&&Math.random()<ultChance('elec',lvl);
    const t=pick(1,s.type,dmg,red?rg(s.id)*1.35:rg(s.id))[0];if(!t)return false;
    const hops=(lvl<=5?lvl:5+Math.floor((lvl-5)/3))+f.cnt+(red?2+Math.floor(ultU(lvl)/6):0);
    const hit=new Set([t]);let cur=t,d=red?dmg*(1.3+.02*ultU(lvl)):dmg;const pts=[[ax(),ay()-10],[t.x,t.y]];
    if(red)txt(t.x,t.y-26,'¡RAYO ROJO!','#ff3030',18);
    dealDamage(t,d,s.type);
    for(let i=0;i<hops;i++){
      d*=red?.86:.85;let nb=null,bd=red?220*220:170*170;
      for(const e of G.enemies){if(e.dead||hit.has(e)||mult(e,s.type)===0)continue;
        if(e.hp-e.pending-dotLeft(e)<=0.5)continue;
        const dd=(e.x-cur.x)**2+(e.y-cur.y)**2;if(dd<bd){bd=dd;nb=e}}
      if(!nb)break;hit.add(nb);pts.push([nb.x,nb.y]);dealDamage(nb,d,s.type);cur=nb;
    }
    G.fx.push({k:'bolt',pts,t:.25,T:.25,c:red?'#ff2a2a':col,sk:'elec'});
    return true;
  }
  if(s.kind==='pulse'){
    const R=(170+4*lvl)*f.rad;
    if(!pick(1,s.type,dmg,R).length)return false;
    for(const e of G.enemies){if(e.dead||Math.hypot(e.x-ax(),e.y-ay())>R+e.r)continue;dealDamage(e,dmg,s.type)}
    G.fx.push({k:'pulse',x:ax(),y:ay(),r:R,t:.45,T:.45,c:col});
    return true;
  }
  const tg=pick(n,s.type,dmg,rg(s.id));
  if(!tg.length)return false;
  for(const t of tg){
    const ex=dmg*mult(t,s.type);
    if(s.kind==='burst'){
      const R=(55+lvl)*f.rad,bx=t.x,by=t.y;
      for(const o of G.enemies){
        if(o.dead||(o.x-bx)**2+(o.y-by)**2>(R+o.r)**2)continue;
        dealDamage(o,dmg,s.type);
        if(o.dead)continue;
        if(s.id==='thorn'){
          addDot(o,'poison',(3+2*lvl)*S.dmg,4,true);
          if(lvl>=ULT_LVL&&Math.random()<ultChance('thorn',lvl)){o.root=3+.1*ultU(lvl);txt(o.x,o.y-o.r-12,'🌿 ¡Enredado!','#82e04e',13)}
        }
        if(s.id==='hail'){
          if(mult(o,s.type)>0)o.slow={a:Math.min(.8,.3+.03*lvl),t:2.5};
          if(lvl>=ULT_LVL&&Math.random()<ultChance('hail',lvl)){o.stun=2+.05*ultU(lvl);txt(o.x,o.y-o.r-12,'❄ ¡Congelado!','#7fd6ff',13)}
        }
      }
      G.fx.push(s.id==='thorn'?{k:'thorn',x:bx,y:by,r:R,t:.6,T:.6,sp:Array.from({length:LOWQ?7:13},(_,i)=>[i*2.4+Math.random(),Math.sqrt(Math.random())*R,.7+Math.random()*.6])}
        :{k:'hail',x:bx,y:by,r:R,t:.6,T:.6,sp:Array.from({length:LOWQ?6:11},()=>[(Math.random()-.5)*2*R*.8,(Math.random()-.5)*2*R*.8,Math.random()*.15,.6+Math.random()*.6])});
    }else if(s.kind==='smite'){
      dealDamage(t,dmg,s.type);
      for(const o of G.enemies){if(o===t||o.dead)continue;if((o.x-t.x)**2+(o.y-t.y)**2<(45*f.rad)**2)dealDamage(o,dmg*.5,s.type)}
      G.fx.push({k:'smite',x:t.x,y:t.y,r:45*f.rad,t:.45,T:.45,c:col});
    }else if(s.kind==='orb'){
      const a=Math.atan2(t.y-ay(),t.x-ax());
      G.projs.push({kind:'orb',sk:s.id,x:ax(),y:ay(),vx:Math.cos(a)*s.spd,vy:Math.sin(a)*s.spd,size:s.size,life:s.life,type:s.type,dmg,tgt:t,exp:ex,hit:new Set(),src:s.n});
      t.pending+=ex;
    }else{
      const p={kind:'home',sk:s.id,ang:Math.atan2(t.y-ay(),t.x-ax()),x:ax()+(Math.random()-.5)*10,y:ay()-10,spd:s.spd,size:s.size,type:s.type,dmg,tgt:t,exp:ex,life:5,src:s.n};
      if(s.id==='fire'){p.burn=true;p.splash=(45+4*lvl)*f.rad}
      if(s.id==='goldshot'){
        p.goldK=lvl;p.col='#ffd24a';
        if(lvl>=6){const m=goldMult(lvl);p.dmg*=m;p.exp=ex*m;p.gm=m}
      }
      if(lvl>=ULT_LVL&&s.id==='fire'&&Math.random()<ultChance(s.id,lvl)){
        const u=ultU(lvl);
        const k=3+.1*u;p.xl=true;p.dmg*=k;p.exp=ex*k;p.splash*=2.2;p.size*=2.2
      }
      G.projs.push(p);t.pending+=p.exp;
    }
  }
  return true;
}

    const t=all.filter(e=>mult(e,s.type)>0);if(t.length<3)return false;

    txt(ax(),ay()-70,'★ ¡Orbe gigante!',col,18);

  }
  if(id==='spear'){
    if(all.length<3)return false;
    let n=0;
    for(const e of all){

      dealDamage(e,dmg,s.type);
      if(!e.dead){e.stun=(2+.05*u)*TOWER_BALANCE.control;txt(e.x,e.y-e.r-12,'📌','#fff',14)}

    }
    txt(ax(),ay()-70,'★ ¡Clavados al suelo!',col,18);

    if(countNear(ax(),ay(),R)<3)return false;
    for(const e of G.enemies){
      if(e.dead||Math.hypot(e.x-ax(),e.y-ay())>R+e.r)continue;
      dealDamage(e,dmg*3,'divine');

    txt(ax(),ay()-70,'★ ¡Pulso supremo!',TYPES.divine.c,18);

function updateUlts(dt){

const goldMult=l=>1+Math.min(1.5+.15*(l-6),G.gold/1000*(.5+.05*(l-6)));
const orbitInfo=l=>({n:Math.min(5,l)+tf('orbit').cnt,r:(7+.6*l)*tf('orbit').rad,rad:130+4*l,sp:2+.12*l});
const tentacleCount=l=>Math.min(8,1+Math.floor((l-1)/2))+tf('tentacle').cnt;
function updateOrbit(dt,adv=true){
  const l=G.skills.orbit;if(!l)return;
  const o=orbitInfo(l),sk=SK.find(x=>x.id==='orbit');
  if(adv)G.orbA+=o.sp*dt;
  const dmg=sk.dmg*BAL.orbit*DMG_K*skK(l)*(1+.06*Math.max(0,l-5))*S.dmg;
  SRC='Bolas de fuego orbitales';
  for(let i=0;i<o.n;i++){
    const a=G.orbA+i*6.283/o.n,bx=ax()+Math.cos(a)*o.rad,by=ay()+Math.sin(a)*o.rad;
    for(const e of G.enemies){
      if(e.dead)continue;
      const rr=o.r+e.r;
      if((e.x-bx)**2+(e.y-by)**2>rr*rr)continue;
      if(!e.ob)e.ob=[];
      const ok=i+(G.orbOff||0);
      if((e.ob[ok]||0)>G.t)continue;
      e.ob[ok]=G.t+.4;
      dealDamage(e,dmg,'fire');
      if(!e.dead)addDot(e,'fire',dmg*.3,2,false);
    }
  }

function updateTentacles(dt){
  const l=G.skills.tentacle;

  const n=tentacleCount(l),sk=SK.find(x=>x.id==='tentacle');
  while(G.tent.length<n)G.tent.push({tgt:null,tk:Math.random()*.5});
  G.tent.length=n;
  const dmg=sk.dmg*BAL.tentacle*DMG_K*skK(l)*S.dmg,range=rg('tentacle'),used=new Set();
  for(const t of G.tent)if(t.tgt&&!t.tgt.dead)used.add(t.tgt);
  SRC='Pulpo vampírico';
  for(const t of G.tent){
    if(t.tgt&&(t.tgt.dead||Math.hypot(t.tgt.x-ax(),t.tgt.y-ay())>range+30))t.tgt=null;
    if(!t.tgt){
      let nb=null,bd=range*range;
      for(const e of G.enemies){
        if(e.dead||used.has(e)||mult(e,'dark')===0)continue;
        const dd=(e.x-ax())**2+(e.y-ay())**2;

  if(G.healT<=0){G.healT=1;if((G.healAcc||0)>=1)txt(ax()+(Math.random()-.5)*30,ay()-36,'+'+Math.round(G.healAcc),'#b27cff',13);G.healAcc=0}

function updateSkelDragons(dt){
  if(!G.sdrags.length)return;
  SRC='Dragón esqueleto';
  const x0=cx(),y0=cy(),leash=S.range+60;
  for(const dg of G.sdrags){
    if(dg.hp<=0)continue;
    dg.flap+=dt*9;dg.atk-=dt;dg.fcd-=dt;
    let tgt=null,bd=1e12;
    for(const e of G.enemies){
      if(e.dead||Math.hypot(e.x-x0,e.y-y0)>leash)continue;
      const dd=(e.x-dg.x)**2+(e.y-dg.y)**2;if(dd<bd){bd=dd;tgt=e}
    }
    dg.look=tgt?Math.atan2(tgt.y-dg.y,tgt.x-dg.x):null;
    if(dg.flame&&dg.fcd<=0&&tgt&&Math.sqrt(bd)<=170+12*dg.flame){
      const a=Math.atan2(tgt.y-dg.y,tgt.x-dg.x),len=170+12*dg.flame,half=.5,dmg=dg.dmgb*1.5;
      for(const e of G.enemies){
        if(e.dead)continue;
        const dx=e.x-dg.x,dy=e.y-dg.y,dd=Math.hypot(dx,dy);
        if(dd>len+e.r)continue;
        let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));
        if(Math.abs(da)>half)continue;
        dealDamage(e,dmg,'fire');
      }
      G.drfx.push({x:dg.x,y:dg.y,a,len,half,t:.45,tot:.45,dg,seed:Math.random()*99});dg.breathAt=G.t;dg.breathA=a;dg.face=Math.cos(a)>=0?1:-1;
      dg.fcd=Math.max(4,11-.6*dg.flame);
    }
    if(tgt){
      const dx=tgt.x-dg.x,dy=tgt.y-dg.y,d=Math.hypot(dx,dy),reach=dg.r+tgt.r+4;
      if(d>reach){dg.x+=dx/d*dg.spd*dt;dg.y+=dy/d*dg.spd*dt;dg.face=dx>=0?1:-1}
      else if(dg.atk<=0){dealDamage(tgt,dg.dmgb,'phys');dg.atk=.85;dg.biteAt=G.t;dg.face=dx>=0?1:-1}
    }else{
      dg.a+=dt*.7;
      const tx=x0+Math.cos(dg.a)*105,ty=y0+Math.sin(dg.a)*55-10,dx=tx-dg.x,dy=ty-dg.y,d=Math.hypot(dx,dy);

function avoidHeroTowers(fromBx=G.bx,fromBy=G.by){
  if(G.solo)return;
  const towers=aliveTowers().map(o=>towerPosition(o.i));
  if(!towers.length)return;
  const baseX=hx()+(G.hoff||0),baseY=hy(),radius=TOWER_R+16;
  const dx=G.bx-fromBx,dy=G.by-fromBy,steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/8));
  let x=baseX+fromBx,y=baseY+fromBy;
  const separate=(slide)=>{
    for(const t of towers){
      let nx=x-t.x,ny=y-t.y,d=Math.hypot(nx,ny);
      if(d>=radius)continue;
      if(d<.001){nx=(G.hoff||-1)<0?-1:1;ny=0;d=1}
      nx/=d;ny/=d;
      const push=radius-Math.hypot(x-t.x,y-t.y);
      x=t.x+nx*radius;y=t.y+ny*radius;
      if(slide&&dx*nx+dy*ny<0){
        const side=Math.sign(nx*dy-ny*dx)||1;
        x-=ny*push*side;y+=nx*push*side;
      }
    }
  };
  separate(false);
  for(let i=0;i<steps;i++){x+=dx/steps;y+=dy/steps;separate(true)}

}

/* ============ ENEMIGOS QUE DISPARAN ============ */
function rangedAct(e,dist,dt,sp){
  const r=e.rng;if(!r)return false;
  const tn=taunter(e);
  const tx=tn?tn.x:(e._tx!=null?e._tx:cx()),ty=tn?tn.y:(e._ty!=null?e._ty:cy());
  const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;
  if(d<=r.range){
    e.shotCd-=dt;
    if(e.shotCd<=0){e.shotCd=r.cd*(1+Math.random()*.2);fireEnemyShot(e,tx,ty)}
    return true;
  }
  if(e.root>0)return true;
  if(!tn&&wallHit(e,dist,dt))return true;
  e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt;
  return true;
}
function fireEnemyShot(e,tx,ty){
  const r=e.rng,n=r.burst||1,base=Math.atan2(ty-e.y,tx-e.x);
  const dmg=e.dmg*2.4*(e.boss?1.1:1)/(n>1?1.6:1);
  for(let i=0;i<n;i++){
    const a=base+(i-(n-1)/2)*.22;
    G.eshots.push({x:e.x,y:e.y,vx:Math.cos(a)*r.spd,vy:Math.sin(a)*r.spd,dmg,life:3.5,col:r.col||'#ff7a7a',r:e.boss?7:5});
  }
}
function updateEShots(dt){
  if(!G.eshots.length)return;
  const x0=cx(),y0=cy(),tl=G.dragon?[G.dragon,...G.sdrags]:G.sdrags;
  for(const sh of G.eshots){
    sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.life-=dt;
    if(sh.life<=0){sh.dead=true;continue}
    let hit=false;
    const dm=Math.hypot(sh.x-x0,sh.y-y0);
    const w=G.walls;
    if(w&&dm<=w.R+3&&dm>=w.R-8){
      const idx=Math.floor(((Math.atan2(sh.y-y0,sh.x-x0)+6.283)%6.283)/6.283*w.segs.length),sg=w.segs[idx];
      if(sg&&sg.hp>0){sg.hp-=sh.dmg;hit=true}
    }
    if(!hit)for(const u of tl){if(u.hp<=0||u.inv)continue;if((u.x-sh.x)**2+(u.y-sh.y)**2<=(u.r+sh.r)**2){u.hp-=sh.dmg*.8*(u.dk||1);hit=true;break}}
    if(!hit)for(const a of G.allies){if(a.fly)continue;if((a.x-sh.x)**2+(a.y-sh.y)**2<=(a.r+sh.r+3)**2){a.hp-=sh.dmg*.8;hit=true;break}}
    if(!hit&&!G.dead&&dm<=20+sh.r){G.tgtHero=0;hurt(sh.dmg*S.def);hit=true}
    if(!hit&&!G.solo){const st=syncTowers();for(let i=0;i<st.length;i++){if(st[i].dead)continue;if(Math.hypot(sh.x-towX(i),sh.y-towY(i))<TOWER_R+sh.r){hurtTower(i,sh.dmg*TOWER_DMG);hit=true;break}}}
    if(!hit)for(const i of HIDX()){if(i===HCUR||G.hl[i].dead)continue;const pB=heroPos(i);if(Math.hypot(sh.x-pB.x,sh.y-pB.y)<=20+sh.r){G.tgtHero=i;hurt(sh.dmg*S.def);hit=true;break}}
    if(hit){sh.dead=true;G.fx.push({k:'p',x:sh.x,y:sh.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,t:.3,c:sh.col})}
  }
  G.eshots=G.eshots.filter(q=>!q.dead);
}
function drawEShots(){
  for(const sh of G.eshots){
    ctx.beginPath();ctx.arc(sh.x,sh.y,sh.r,0,6.3);ctx.fillStyle=sh.col;ctx.fill();ctx.beginPath();ctx.arc(sh.x,sh.y,sh.r*1.7,0,6.3);ctx.globalAlpha=.3;ctx.fill();ctx.globalAlpha=1;
  }
}

  Object.assign(G.cls,k.cls);G.soloTestChoice=k.choice;G.soloSupportBasic=k.support;G.noSpawn=k.noSpawn;G.soloAnimSpeed=k.spd;G.soloAnimAim=k.aim;G.soloDeps=k.deps;
  G.tv=(G.tv||0)+1;recalc();G.hp=S.maxHp;refreshAll();
  if(k.run)runSoloTest();else refreshSoloTestPanel()

  if(G.rounds&&G.modal)return;

  updateAutoUpgrades(dt);

  updateZones(dt);
  // enemigos

  const TWR=aliveTowers().map(o=>({i:o.i,x:towX(o.i),y:towY(o.i)}));

let TFC={g:null,v:-1,c:{}};
function tf(id){
  if(!G)return{dm:1,rad:1,dur:1,cd:1,cnt:0,hpm:1,hm:1,def:1,shm:1,reg:0,atk:1,dodge:0,pc:0,vmx:0};
  if(TFC.g!==G||TFC.v!==(G.tv||0)){TFC={g:G,v:G.tv||0,c:{}}}
  let o=TFC.c[id];if(o)return o;
  o={dm:1,rad:1,dur:1,cd:1,cnt:0,hpm:1,hm:1,def:1,shm:1,reg:0,kheal:0,vmx:0,pc:0,critc:0,critm:1,scap:0,atk:1,dodge:0};
  const T=TIERS[id],l=clv(id)||(G.skills&&G.skills[id])||(G.spLv&&G.spLv[id])||0;
  if(T)for(let i=0;i<4;i++){if(l<TIER_LV[i])break;const f=T[i][2];
    for(const k in f){const v=f[k];if(k==='dm'||k==='rad'||k==='dur'||k==='cd'||k==='hpm'||k==='hm'||k==='def'||k==='shm'||k==='critm'||k==='atk')o[k]*=v;
      else if(k==='cnt'||k==='dodge'||k==='reg'||k==='vmx'||k==='pc'||k==='critc'||k==='scap'||k==='kheal'||k==='cheal'||k==='haste'||k==='heal'||k==='burn'||k==='mark')o[k]=(o[k]||0)+v;else o[k]=v}}
  /* el cristal de alcance también agranda el radio de las habilidades del héroe */
  if(S.rk>1&&!(G.skills&&id in G.skills)&&!(G.spLv&&id in G.spLv))o.rad*=S.rk;
  if(S.durK>1)o.dur*=S.durK;
  TFC.c[id]=o;return o;
}
let INTIER=false;
function dealDamage(e,amount,type){
  const id=SRCMAP[SRC];
  if(!id||INTIER){return dealDamage0(e,amount,type)}
  const f=tf(id);let a=amount*f.dm;
  if(f.exec&&e.hp<e.max*f.exec[0])a*=f.exec[1];
  const hp0=e.hp;dealDamage0(e,a,type);
  if(f.heal){const dd=Math.max(0,hp0-e.hp);if(dd>0)G.hp=Math.min(S.maxHp,G.hp+dd*f.heal)}
  if(e.dead)return;
  if(f.stun&&Math.random()<f.stun[0])e.stun=Math.max(e.stun||0,f.stun[1]);
  if(f.slow)e.slow={a:f.slow[0],t:f.slow[1]};
  if(f.mark){e.vt=Math.max(e.vt||0,G.t+4);e.vm=Math.max(e.vm||1,1+f.mark)}
  if(f.burn)addDot(e,'fire',a*f.burn/3,3,false);
  if(f.chain||f.splash){
    INTIER=true;
    if(f.chain){let n=0;for(const o of G.enemies){if(n>=f.chain)break;if(o===e||o.dead||(o.x-e.x)**2+(o.y-e.y)**2>110*110)continue;n++;dealDamage0(o,a*.5,type);G.fx.push({k:'bolt',pts:[[e.x,e.y],[o.x,o.y]],t:.15,c:'#ffffff'})}}
    if(f.splash){let n=0;const R=f.splash[0];for(const o of G.enemies){if(n>=10)break;if(o===e||o.dead||(o.x-e.x)**2+(o.y-e.y)**2>R*R)continue;n++;dealDamage0(o,a*f.splash[1],type)}if(G.fx.length<300)G.fx.push({k:'ring',x:e.x,y:e.y,r:R,t:.25,c:'#ffd27a'})}
    INTIER=false;
  }
}
function tierCast(id,f,x0,y0){
  if(!TIERS[id])return;
  if(f.cheal)G.hp=Math.min(S.maxHp,G.hp+S.maxHp*f.cheal);
  if(f.shield)G.shield=(G.shield||0)+S.maxHp*f.shield;
  if(f.haste)G.haste=Math.max(G.haste||0,f.haste);
  if(f.nova){const l=clv(id),R=f.nova[1],d=hdmg(l)*f.nova[0],ps=SRC;SRC=TIERNAME[id]||SRC;INTIER=true;
    for(const e of G.enemies){if(e.dead||Math.hypot(e.x-x0,e.y-y0)>R+e.r)continue;dealDamage0(e,d,'magic')}INTIER=false;SRC=ps;
    G.fx.push({k:'ring',x:x0,y:y0,r:R,t:.4,c:'#ffd24a'})}
}
function tierRecalc(){
  let def=1,reg=0;
  for(const hid of (G.heroes||[G.hero]))for(const a of CLS[hid]){const f=tf(a.id);def*=f.def;reg+=f.reg}
  G.tdef=def;G.trg=reg;G.tdv=G.tv||0;
}
function tierHtml(id){
  const T=TIERS[id];if(!T)return'';const l=learnedClv(id)||(G&&G.skills&&G.skills[id])||(G&&G.spLv&&G.spLv[id])||0;
  return '<div class="sec" style="color:#ffd24a;margin-top:6px">★ Mejoras de habilidad</div>'+T.map((t,i)=>'<div class="ut'+(l>=TIER_LV[i]?' on':'')+'">'+SPR.tierIconHtml('mage',id,i,32)+(l>=TIER_LV[i]?'✔ ':'')+'Nv'+TIER_LV[i]+': <b>'+t[0]+'</b><br>'+t[1]+'</div>').join('');
}
function tierPop(id,lv){
  const i=TIER_LV.indexOf(lv);if(i<0||!TIERS[id])return;
  const t=TIERS[id][i];txt(cx(),cy()-100,'★ MEJORA Nv'+lv+': '+t[0],'#ffd24a',20);
  for(let k=0;k<3;k++)G.fx.push({k:'ring',x:cx(),y:cy(),r:50+k*30,t:.4+k*.1,c:'#ffd24a'});
  if(G.fx.length<300)for(let k=0;k<14;k++){const a=k/14*6.283;G.fx.push({k:'p',x:cx(),y:cy(),vx:Math.cos(a)*120,vy:Math.sin(a)*120,t:.6,c:'#ffd24a'})}
}

/* Mecánicas de los tres héroes. Recursos y zonas se reinician con G.ht. */
const BARD_SONGS=['j_march','j_refuge','j_ballad'];
function nhTargets(x,y,r){return G.enemies.filter(e=>!e.dead&&Math.hypot(e.x-x,e.y-y)<=r+e.r)}
function nhRing(x,y,r,c){if(G.fx.length<380)G.fx.push({k:'ring',x,y,r,t:.4,c})}
function nhDamage(id,e,d,type){const ps=SRC;SRC=TIERNAME[id]||id;dealDamage(e,d,type);SRC=ps}
function nhArea(id,x,y,r,d,type,cap=24){for(const e of nhTargets(x,y,r).slice(0,cap))nhDamage(id,e,d,type);nhRing(x,y,r,TYPES[type].c);
  if(id==='al_spark'&&hxSpr('alx_spark_1'))fxRng('alx_spark',2,6,{x,y:y+r*.25,w:r*2.4,ay:.85,d:.7,fi:0,fo:.3});
  else if(id==='al_mix'&&hxSpr('alx_mix_1'))fxSeq('alx_mix',6,{x,y,w:r*2.2,d:.8,fi:0,fo:.3});
  else if(id==='al_transmute'&&hxSpr('alx_transmute_1'))fxSeq('alx_transmute',6,{x,y:y+r*.2,w:r*2.2,ay:.85,d:1,fi:0,fo:.3});
  else{const sf={al_spark:'al_boom1',al_mix:'al_boom2',al_transmute:'al_boom2'}[id];if(sf)sprFx({id:sf,x,y,w:r*2.3,d:.5,g0:.4,g1:1.05,fo:.6,add:true})}}
function nhHeal(x,y,r,pct){if(Math.hypot(cx()-x,cy()-y)<=r)G.hp=Math.min(S.maxHp,G.hp+S.maxHp*pct);for(const a of G.allies)if(a.hp>0&&Math.hypot(a.x-x,a.y-y)<=r) a.hp=Math.min(a.max,a.hp+a.max*pct)}
function shamanStatic(n){G.ht.static=Math.max(0,Math.min(30,(G.ht.static||0)+n))}
function bardSong(){
  const T=G.ht;
  if(T.concertOn>0)return BARD_SONGS[Math.min(2,Math.floor(3*(1-T.concertOn/T.concertDuration)))];
  if(T.bardSong&&clv(T.bardSong))return T.bardSong;
  return BARD_SONGS.find(id=>clv(id))||null;
}
function bardLevel(id){return clv(id)||(G.ht.concertOn>0?clv('j_concert'):0)}
function bardSwitch(){
  if(!G||G.hero!=='bard'||G.modal||G.over||G.ht.concertOn>0)return;
  const choices=BARD_SONGS.filter(id=>clv(id));if(choices.length<2)return;
  const next=choices[(choices.indexOf(bardSong())+1)%choices.length];G.ht.bardSong=next;bardChanged(next);
  if(typeof refreshHero==='function')refreshHero();
}
function bardChanged(song){
  const T=G.ht;if(T.lastSong===song)return;
  const l=clv('j_crescendo'),stacks=Math.min(5,Math.floor((T.songAge||0)/2));
  if(l&&T.lastSong&&stacks)nhArea('j_crescendo',cx(),cy(),(130+2*l)*tf('j_crescendo').rad,hdmg(l)*(.25+.025*l)*stacks,'magic');
  T.songAge=0;T.lastSong=song;
}
function newHeroesAttack(){
  if(G.hero==='bard'&&bardSong()==='j_march'){const l=bardLevel('j_march');return 1+(.08+.012*l)*tf('j_march').atk}
  if(G.hero==='alchemist')return (1+.02*clv('al_distill'))*tf('al_distill').atk;
  return 1;
}
function bardAllySpeed(a){return G.hero==='bard'&&bardSong()==='j_march'&&Math.hypot(a.x-cx(),a.y-cy())<=250*tf('j_march').rad?1+(.08+.012*bardLevel('j_march'))*tf('j_march').atk*.5:1}
function newHeroesDefense(){
  if(G.hero==='bard'&&bardSong()==='j_refuge')return 1-Math.min(.45,(.08+.008*bardLevel('j_refuge'))*tf('j_refuge').shm);
  if(G.hero==='alchemist'&&clv('al_coat')){const n=(G.ht.chemicals||[]).filter(z=>z.until>G.t&&Math.hypot(z.x-cx(),z.y-cy())<z.r+80).length;return 1-Math.min(.2,Math.min(3,n)*(.01+.0012*clv('al_coat')))}
  return 1;
}
function nhChem(kind,x,y,r,duration,l,id){
  const zones=G.ht.chemicals||(G.ht.chemicals=[]);if(zones.length>=16)zones.shift();
  zones.push({kind,x,y,r,until:G.t+duration,tk:0,l,id});
}
function nhIgnite(x,y,r){
  if(G.hero!=='alchemist')return;
  for(const z of G.ht.chemicals||[])if(z.kind==='oil'&&z.until>G.t&&Math.hypot(z.x-x,z.y-y)<=z.r+r){z.kind='flame';z.until=Math.min(z.until,G.t+4);z.tk=0}
}
function newHeroesHit(p,e){
  if(!p.nh||p.nhCounted)return;p.nhCounted=true;
  if(p.nh==='shaman'&&G.hero==='shaman'){
    if(e.wetUntil>G.t)shamanStatic(1);
    const l=clv('c_arc');if(l){const targets=nhTargets(e.x,e.y,170).filter(o=>o!==e).sort((a,b)=>(b.wetUntil>G.t)-(a.wetUntil>G.t)).slice(0,Math.min(6,1+Math.floor(l/7)+tf('c_arc').cnt));
      for(const o of targets){nhDamage('c_arc',o,hdmg(l)*(.35+.025*l),'elec');G.fx.push({k:'bolt',pts:[[e.x,e.y],[o.x,o.y]],t:.2,c:'#8de9ee'})}}
  }
  if(p.nh==='bard'&&G.hero==='bard'){
    const T=G.ht;T.notes=(T.notes||0)+1;T.beat=(T.beat||0)+1;
    if(T.beat>=4){T.beat=0;const l=clv('j_roll');nhArea(l?'j_roll':'Remate musical',cx(),cy(),l?(100+2*l)*tf('j_roll').rad:100,l?hdmg(l)*(1+.06*l):hdmg(1)*.6,'magic')}
    const l=clv('j_refrain');if(l&&T.notes%8===0){for(const o of nhTargets(cx(),cy(),380).slice(0,1+tf('j_refrain').cnt))nhDamage('j_refrain',o,p.dmg*(.35+.015*l),'magic')}
  }
  if(p.nh==='alchemist'&&G.hero==='alchemist'){
    const l=clv('al_flask');if(l){const ps=SRC;SRC='Frasco corrosivo';if(!e.dead)addDot(e,'poison',hdmg(l)*.15,3,false);SRC=ps;if(hxSpr('alx_flask_1'))fxRng('alx_flask',2,3,{x:e.x,y:e.y+6,w:(38+l)*tf('al_flask').rad*2.6,ay:.85,d:.4,fi:0,fo:.3});nhChem('acid',e.x,e.y,(38+l)*tf('al_flask').rad,5*tf('al_flask').dur,l,'al_flask')}
  }
}
function newHeroesShot(p){
  const h=G.hero;if(!['shaman','bard','alchemist'].includes(h))return;
  p.nh=h;
  if(h==='bard'&&clv('j_chord')){
    const l=clv('j_chord'),a=Math.atan2(p.tgt.y-p.y,p.tgt.x-p.x),k=1+.03*l;
    p.kind='orb';p.vx=Math.cos(a)*480;p.vy=Math.sin(a)*480;p.life=1.15;p.hit=new Set();p.nhLeft=2+Math.floor(l/7)+tf('j_chord').cnt;p.dmg*=k;p.exp*=k;
  }
  if(h==='alchemist'){if(clv('al_distill')&&hxSpr('al_distill_a')&&G.t-(G.ht.distFx||-9)>.45){G.ht.distFx=G.t;if(hxSpr('alx_distill_1'))fxSeq('alx_distill',6,{x:cx(),y:cy()-24,w:64,d:.55,fi:0,fo:.3,add:true});else{sprFx({id:'al_distill_a',x:cx(),y:cy()-26,w:56,d:.5,g0:.6,g1:1.1,fo:.5,add:true});sprFx({id:'al_distill_b',x:cx()+18,y:cy()-14,w:50,d:.4,g0:.7,g1:1.1,fo:.5,add:true})}}p.flask=true;p.size=6;if(clv('al_flask'))p.splash=(38+clv('al_flask'))*tf('al_flask').rad}
}
function shamanTick(dt,rdy,done,retry){
  const T=G.ht,x=cx(),y=cy();let l,f;
  const zones=T.weather||(T.weather=[]),totems=T.stormTotems||(T.stormTotems=[]);
  const place=(kind,id,r,duration)=>{const e=nhTargets(x,y,rg(id))[0];if(!e){retry(id);return false}if(zones.length>=8)zones.shift();zones.push({kind,id,x:e.x,y:e.y,r,until:G.t+duration,tk:0,l:clv(id)});return true};
  {queueHeroCast(rdy,'c_rain',()=>{l=clv('c_rain');f=tf('c_rain');if((l=clv('c_rain'))&&rdy('c_rain')){f=tf('c_rain');if(place('rain','c_rain',(95+2*l)*f.rad,(5+.1*l)*f.dur))done('c_rain',Math.max(7,13-.25*l))}});}
  for(const id of ['c_thunder','c_tide']){queueHeroCast(rdy,id,()=>{l=clv(id);f=tf(id);if((l=clv(id))&&rdy(id)){
    if(!G.enemies.some(e=>!e.dead)){retry(id);return;}f=tf(id);
    const count=id==='c_thunder'?Math.min(4,1+Math.floor(l/10)+f.cnt):1;
    for(let i=0;i<count;i++){if(totems.length>=7)totems.shift();const a=i*2.4+G.t;
      totems.push({kind:id,x:x+Math.cos(a)*65,y:y+Math.sin(a)*45,hp:allyHp(70+8*l)*f.hpm,max:allyHp(70+8*l)*f.hpm,until:G.t+(id==='c_thunder'?14+.3*l:10+.2*l)*f.dur,tk:0,l})}
    done(id,id==='c_thunder'?Math.max(12,22-.4*l):Math.max(14,24-.4*l));
  }});}
  {queueHeroCast(rdy,'c_wind',()=>{l=clv('c_wind');f=tf('c_wind');if((l=clv('c_wind'))&&rdy('c_wind')){f=tf('c_wind');const R=(130+3*l)*f.rad,targets=nhTargets(x,y,R);if(!targets.length)retry('c_wind');else{for(const e of targets){nhDamage('c_wind',e,hdmg(l)*1.5,'phys');if(!e.dead&&!e.boss){const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*60;e.y+=dy/d*60}}nhRing(x,y,R,'#c4eff1');done('c_wind',Math.max(6,12-.25*l))}}});}
  {queueHeroCast(rdy,'c_cloud',()=>{l=clv('c_cloud');f=tf('c_cloud');if((l=clv('c_cloud'))&&rdy('c_cloud')){f=tf('c_cloud');if(place('cloud','c_cloud',(80+2*l)*f.rad,(5+.12*l)*f.dur))done('c_cloud',Math.max(9,17-.35*l))}});}
  {queueHeroCast(rdy,'c_skin',()=>{l=clv('c_skin');f=tf('c_skin');if((l=clv('c_skin'))&&rdy('c_skin')){if(T.stormShield>0)retry('c_skin');else{T.stormShield=S.maxHp*(.1+.006*l)*tf('c_skin').shm;T.stormShieldUntil=G.t+6;T.stormShieldArmed=true;done('c_skin',Math.max(10,20-.4*l))}}});}
  if(T.stormShieldArmed&&(!(T.stormShield>0)||T.stormShieldUntil<=G.t)){T.stormShieldArmed=false;T.stormShield=0;l=clv('c_skin');nhArea('c_skin',x,y,150*tf('c_skin').rad,hdmg(l)*1.6,'elec')}
  {queueHeroCast(rdy,'c_overload',()=>{l=clv('c_overload');f=tf('c_overload');if((l=clv('c_overload'))&&rdy('c_overload')){f=tf('c_overload');const targets=nhTargets(x,y,rg('c_overload')).filter(e=>e.wetUntil>G.t).slice(0,2+Math.floor(l/6)+f.cnt);
    if(!targets.length)retry('c_overload');else{for(const e of targets){nhDamage('c_overload',e,hdmg(l)*2.4,'elec');e.wetUntil=0;if(!e.dead)e.stun=Math.max(e.stun||0,(.7+.02*l)*f.dur*(e.boss?.25:1))}done('c_overload',Math.max(6,12-.25*l))}}});}
  {queueHeroCast(rdy,'c_vortex',()=>{l=clv('c_vortex');f=tf('c_vortex');if((l=clv('c_vortex'))&&rdy('c_vortex')){f=tf('c_vortex');if(place('vortex','c_vortex',(100+2*l)*f.rad,(3+.1*l)*f.dur))done('c_vortex',Math.max(10,18-.35*l))}});}
  {queueHeroCast(rdy,'c_monsoon',()=>{l=clv('c_monsoon');f=tf('c_monsoon');if((l=clv('c_monsoon'))&&rdy('c_monsoon')){if(!nhTargets(x,y,440).length)retry('c_monsoon');else{T.monsoonOn=(7+.2*l)*tf('c_monsoon').dur;T.monsoonTk=0;done('c_monsoon',Math.max(35,65-1.4*l));txt(x,y-65,'⛈️ ¡MONZÓN!','#8de9ee',20)}}});}
  if(T.monsoonOn>0){T.monsoonOn=Math.max(0,T.monsoonOn-dt);T.monsoonTk-=dt;if(T.monsoonTk<=0){T.monsoonTk=1;shamanStatic(3);const targets=nhTargets(x,y,420);for(const e of targets)e.wetUntil=G.t+4;for(const e of targets.slice(0,6))nhDamage('c_monsoon',e,hdmg(clv('c_monsoon'))*1.1,'elec');nhRing(x,y,420,'#55c9c5')}}
  for(const z of zones){if(z.until<=G.t)continue;
    if(z.kind==='cloud'){const e=nhTargets(z.x,z.y,300)[0];if(e){const dx=e.x-z.x,dy=e.y-z.y,d=Math.hypot(dx,dy)||1,k=Math.min(d,35*dt)/d;z.x+=dx*k;z.y+=dy*k}}
    const targets=nhTargets(z.x,z.y,z.r);
    if(z.kind==='rain'||z.kind==='vortex'||T.monsoonOn>0)for(const e of targets)e.wetUntil=G.t+4;
    if(z.kind==='vortex')for(const e of targets){if(e.boss)e.slow={a:.25,t:.3};else{const dx=z.x-e.x,dy=z.y-e.y,d=Math.hypot(dx,dy)||1,k=Math.min(d,55*dt)/d;e.x+=dx*k;e.y+=dy*k}}
    z.tk-=dt;if(z.kind==='cloud'&&z.tk<=0){z.tk=1;for(const e of targets.slice(0,8))nhDamage('c_cloud',e,hdmg(z.l)*.65,'elec');nhRing(z.x,z.y,z.r,'#8de9ee')}
  }
  zones.splice(0,zones.length,...zones.filter(z=>z.until>G.t));
  for(const t of totems){if(t.until<=G.t||t.hp<=0)continue;
    for(const e of nhTargets(t.x,t.y,24))t.hp-=e.dmg*dt*.4;
    if(t.hp<=0)continue;t.tk-=dt;if(t.tk>0)continue;t.tk=1;
    if(t.kind==='c_tide')nhHeal(t.x,t.y,230*tf('c_tide').rad,(.006+.0004*t.l)*tf('c_tide').hm);
    else{const e=nhTargets(t.x,t.y,rg('c_thunder'))[0];if(e&&(T.static||0)>0){shamanStatic(-1);nhDamage('c_thunder',e,hdmg(t.l)*1.4,'elec');G.fx.push({k:'bolt',pts:[[t.x,t.y-18],[e.x,e.y]],t:.2,c:'#8de9ee'})}}
  }totems.splice(0,totems.length,...totems.filter(t=>t.hp>0&&t.until>G.t));
}
function bardTick(dt,rdy,done,retry){
  const T=G.ht,x=cx(),y=cy();let l,f;
  {queueHeroCast(rdy,'j_concert',()=>{l=clv('j_concert');f=tf('j_concert');if((l=clv('j_concert'))&&rdy('j_concert')){if(!nhTargets(x,y,400).length)retry('j_concert');else{T.concertDuration=(9+.15*l)*tf('j_concert').dur;T.concertOn=T.concertDuration;T.concertTk=0;done('j_concert',Math.max(35,65-1.3*l));txt(x,y-65,'🎻 ¡GRAN CONCIERTO!','#edb5ce',19)}}});}
  if(T.concertOn>0){T.concertOn=Math.max(0,T.concertOn-dt);T.concertTk-=dt;if(T.concertTk<=0){T.concertTk=1.5;nhArea('j_concert',x,y,220,hdmg(clv('j_concert'))*.75,'magic')}}
  const song=bardSong();bardChanged(song);if(song)T.songAge=Math.min(10,(T.songAge||0)+dt);

function primalAreaFactor(){return Math.min(1.5,(1+Math.min(.35,Math.max(0,S.maxHp||0)*.00005))*tf('pb_colossal').rad/Math.max(1,S.rk||1))}
function primalReach(){return 50}
function primalAttackSpeed(){return 1}
function primalDefense(){return (1-.006*clv('pb_hide'))*(G.ht.pbTrample>0?1-.005*clv('pb_hide'):1)*(G.ht.pbRoarOn>0?1-Math.min(.35,(.025+.001*clv('pb_uproar'))*(G.ht.pbRoarStacks||0)*tf('pb_uproar').shm):1)}
function primalAttackDamage(d){
  const bonus=G.ht.pbRoarOn>0?(G.ht.pbRoarStacks||0)*(.04+.003*clv('pb_uproar'))*tf('pb_uproar').dm:0;
  return d*(1+.015*clv('pb_momentum'))*(1+bonus);
}
function primalBasic(e,d){
  nhDamage('pb_momentum',e,primalAttackDamage(d),'phys');
  nhRing(e.x,e.y,e.r+9,'#d8b17c');

function primalHurt(d){
  if(!clv('pb_uproar')||!(d>0))return;
  const T=G.ht;if((T.pbRage||0)>=5){T.pbRageDamage=0;T.pbRageUntil=G.t+20;return}
  T.pbRageDamage=(T.pbRageDamage||0)+d;const threshold=Math.max(10,S.maxHp*.04);
  while(T.pbRageDamage>=threshold&&(T.pbRage||0)<5){T.pbRageDamage-=threshold;T.pbRage=(T.pbRage||0)+1;T.pbRageUntil=G.t+20}
  if(T.pbRage>=5)T.pbRageDamage=0;
}

function setBattleMap(id,persist=true){

function paintBattlefield(g,W,H,x0,y0){
  const base=g.createRadialGradient(x0,y0,30,x0,y0,Math.max(W,H)*.6);
  base.addColorStop(0,'#a89e89');base.addColorStop(1,'#7d8460');
  g.fillStyle=base;g.fillRect(0,0,W,H);
  if(FOREST_TEXTURE.ready||(H>W&&FOREST_TEXTURE.portraitReady)){
    // El claro central ocupa la pantalla; las copias reflejadas cubren el zoom mínimo.
    const tw=W/2,th=H/2,image=H>W&&FOREST_TEXTURE.portraitReady?FOREST_TEXTURE.portraitImage:FOREST_TEXTURE.image;
    const iw=image.naturalWidth||tw,ih=image.naturalHeight||th,sw=Math.min(iw,ih*tw/th),sh=sw*th/tw;
    for(let row=-1;row<=1;row++)for(let col=-1;col<=1;col++){
      const flipX=Math.abs(col)%2,flipY=Math.abs(row)%2;
      g.save();g.translate(W/4+col*tw+(flipX?tw:0),H/4+row*th+(flipY?th:0));
      g.scale(flipX?-1:1,flipY?-1:1);g.drawImage(image,(iw-sw)/2,(ih-sh)/2,sw,sh,0,0,tw,th);g.restore();
    }
    return;
  }
  // Terreno de respaldo: piedra gastada y vegetación en las esquinas durante la carga.
  let seed=32167;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
  for(let i=0;i<W*H/1600;i++){
    const x=rnd()*W,y=rnd()*H,r=3+rnd()*10;
    const edge=Math.abs(x-W/2)/(W/2)*Math.abs(y-H/2)/(H/2);
    if(edge<.25){g.fillStyle=i%2?'#c5bdab66':'#716c6155';g.fillRect(x,y,r*2,r);g.strokeStyle='#5f5a4f55';g.lineWidth=.7;g.strokeRect(x,y,r*2,r);continue}
    g.fillStyle=i%2?'#93b65788':'#214d3477';g.beginPath();g.ellipse(x,y,r*2,r,0,0,6.3);g.fill();
    g.strokeStyle=i%2?'#b5cc6877':'#426f3c';g.lineWidth=1;
    g.beginPath();g.moveTo(x-3,y);g.lineTo(x-5,y-7);g.moveTo(x,y);g.lineTo(x+1,y-9);g.moveTo(x+3,y);g.lineTo(x+6,y-5);g.stroke();
    if(i%13===0){g.fillStyle=i%26?'#e9e9c9':'#a7c6ed';for(let k=0;k<4;k++){g.beginPath();g.arc(x+Math.cos(k*1.57)*3,y-6+Math.sin(k*1.57)*3,2,0,6.3);g.fill()}}
  }
}

/* el fondo cubre el mundo visible con el zoom mínimo (0,5) y se dibuja dentro de la transformación del zoom */
function drawBG(x0,y0){
  const BW=Math.ceil(W*2),BH=Math.ceil(H*2);
  if(!BG||BG.w!==W||BG.h!==H||BG.d!==dpr){
    const rs=Math.max(.5,Math.min(dpr*1.25,Math.sqrt(10e6/(BW*BH))));
    const c=document.createElement('canvas');c.width=Math.ceil(BW*rs);c.height=Math.ceil(BH*rs);
    const g2=c.getContext('2d');g2.scale(rs,rs);
    paintBattlefield(g2,BW,BH,BW/2,BH/2);

function updateDying(dt){
  const L=G.dying;if(!L||!L.length)return;
  for(const d of L){
    d.t+=dt;
    for(const p of d.P){
      if(d.t<p.dl)continue;
      p.t+=dt;p.vy+=p.gr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
      if(p.sh==='smoke'){p.vx*=.96;p.vy*=.96}

}
function foeDeathSprite(d,u,tt){
  const R=d.r;let sx=1,sy=1,rot=0,al=1,dx=0,dy=0;
  switch(d.k){
    case'bones':al=u<.15?1:Math.max(0,1-(u-.15)/.12);dx=Math.sin(tt*70)*R*.05;break;
    case'splat':sx=1+u*.8;sy=Math.max(.06,1-u*1.1);al=1-Math.max(0,u-.5)*2;break;
    case'poof':rot=u*9*d.dir;sx=sy=Math.max(0,1-u*1.1);break;
    case'leaves':rot=u*3*d.dir;sx=sy=Math.max(0,1-u*1.1);al=1-u*.5;break;
    case'fall':{const q=Math.min(1,u*3);rot=d.dir*q*1.5;dy=q*R*.4;al=u<.55?1:1-(u-.55)/.45;break}
    case'ghost':sx=1-u*.5;sy=1+u*.9;dy=-u*R*1.2;al=(1-u)*.9;break;
    case'crumble':dx=Math.sin(tt*90)*R*.07;al=tt<.16?1:0;break;
    case'flame':case'phoenix':sx=sy=1+Math.sin(Math.min(1,u*2.5)*3.14)*.25-u*.7;al=1-u*1.1;dy=-u*R*.4;break;
    case'shatter':al=tt<.1?1:0;break;
    case'demon':rot=u*7*d.dir;sx=sy=Math.max(0,1-u*1.5);al=1-u*.6;break;
    case'explode':al=tt<.06?1:0;dx=Math.sin(tt*120)*R*.08;break;
    case'zap':al=u<.3?(Math.floor(tt*45)%2?1:.25):0;break;
    case'bat':rot=d.dir*u*12;dy=u*u*R*7-u*R*1.2;al=1-Math.max(0,u-.5)*2;break;
    case'spider':{const q=Math.min(1,u*4);rot=Math.PI*q*d.dir;dy=-q*R*.2;sy=1-u*.3;al=u<.6?1:Math.max(0,(1-u)/.4);break}
    case'holy':sy=1+u*.6;sx=1-u*.3;dy=-u*R*.9;al=Math.max(0,1-u*1.2);break;
  }
  return{sx,sy,rot,al,dx,dy};
}

const fmtT=t=>{t=Math.floor(t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
function traitLines(e){

function drawTooltip(){
  if(mouse.x<0)return;
  let h=null;
  const wmx=(mouse.x-hx())/Z+hx(),wmy=(mouse.y-hy())/Z+hy();
  for(const e of G.enemies){if((e.x-wmx)**2+(e.y-wmy)**2<(e.r+6)**2){h=e;break}}

  const lines=[h.n+'  ·  Armadura: '+h.armor,'Vida: '+Math.ceil(h.hp)+' / '+Math.ceil(h.max),h.rng?'🎯 Dispara a distancia ('+Math.round(h.rng.range)+')':'',h.invT>0?'🛡️ Invulnerable ahora':'',...traitLines(h)].filter(Boolean);
  const res=[];
  for(const t in TYPES){const m=resOf(h,t);if(m!==1)res.push(TYPES[t].i+' '+TYPES[t].n+' x'+m)}
  const rows=lines.concat(res.length?res:['Sin resistencias ni debilidades']);
  const w=250,hh=rows.length*17+12;
  let x=Math.min(mouse.x+16,W-w-8),y=Math.min(mouse.y+16,H-hh-8);
  ctx.fillStyle='#0d0c1ae8';ctx.fillRect(x,y,w,hh);ctx.strokeStyle='#8f7cff';ctx.strokeRect(x+.5,y+.5,w-1,hh-1);
  ctx.textAlign='left';ctx.font='12px Segoe UI,sans-serif';
  rows.forEach((r,i)=>{
    const m=/x([\d.]+)$/.exec(r);
    ctx.fillStyle=i<lines.length?'#fff':(m&&+m[1]>1?'#7be07b':m&&+m[1]===0?'#999':'#ff9a7a');
    ctx.fillText(r,x+8,y+14+i*17);
  });
  ctx.textAlign='center';
}

function itemCost(id){
  if(id==='egg')return G.dr.eggCost;
  if(id.startsWith('sp_')){const k=id.slice(3);return Math.round(SPBASE[k]*Math.pow(1.27,Math.min(20,G.spLv[k])-1)*lateK(G.spLv[k]))}
  if(id==='potion')return 30+Math.floor(G.t/10);
  return ITEMS.find(i=>i.id===id).cost(G.items[id]);
}
function itemAvail(id){
  if(id==='egg')return !G.dragon&&!G.dr.egg;
  if(id.startsWith('sp_')){const sp=SPS.find(s=>'sp_'+s.id===id);return tLvl()>=sp.unlock&&G.spLv[sp.id]<SPMAX}
  if(id==='potion')return G.hp<S.maxHp;
  const it=ITEMS.find(i=>i.id===id);return G.items[id]<it.max;
}
function buy(id){
  if(!shopOk()||!itemAvail(id))return;
  if(id==='egg'){buyEgg();refreshAll();return}
  const c=itemCost(id);if(G.gold<c)return;
  G.gold-=c;
  if(id==='potion')G.hp=Math.min(S.maxHp,G.hp+S.maxHp*.5);
  else if(id.startsWith('sp_'))G.spLv[id.slice(3)]++;
  else{G.items[id]++;if(id==='robe')eachHero(()=>{G.hp+=25})}
  recalc();refreshAll();
}

let tipSrc=null,tipTo=0;
function showTip(el){
  const t=$('#tip');if(!el||!el._tip){t.style.display='none';tipSrc=null;return}
  tipSrc=el;t.innerHTML=el._tip();t.style.display='block';
  const r=el.getBoundingClientRect(),w=t.offsetWidth,h=t.offsetHeight;
  let x=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2)),y=r.top-h-8;
  if(y<6)y=Math.min(innerHeight-h-6,r.bottom+8);
  t.style.left=x+'px';t.style.top=y+'px';
}
function refreshTip(){if(tipSrc){if(!document.body.contains(tipSrc)||tipSrc.offsetParent===null)showTip(null);else $('#tip').innerHTML=tipSrc._tip()}}

function setupTip(){
  const bp=$('#bottomp');

function upgradeOptions(section,consumables=false){
  const option=(id,level,max,cost,wallet,run,available=true)=>({section,id,key:'slot:'+section+':'+id,level,max,cost,wallet,run,available});
  const hm=/^hero(\d?)$/.exec(section);
  if(hm){const i=hm[1]?+hm[1]-1:0;if(!G.heroes||!G.heroes[i])return[];return CLS[G.heroes[i]].map(a=>option(a.id,learnedClv(a.id),CLSMAX,clsCost(a.id),i?'pending'+(i+1):'pending',mode=>heroCtx(i,()=>heroUp(a.id,mode))))}
  if(section==='tower')return SK.map((a,i)=>option(a.id,G.skills[a.id],SKMAX,skFree()>0?0:skGoldCost(G.skills[a.id]),null,()=>skillBuy(i)));
  if(section==='inventory'){
    const items=ITEMS.map(a=>option(a.id,G.items[a.id],a.max,itemCost(a.id),null,()=>{const before=G.items[a.id];buy(a.id);return G.items[a.id]>before}));

function autoUpgradeCandidates(key){
  const [kind,section,id]=key.split(':');
  const options=upgradeOptions(section,kind==='slot');
  if(kind==='slot')return options.filter(a=>a.id===id);
  if(kind!=='section')return [];
  // Una casilla elegida por separado conserva su posición explícita en la cola.
  const explicit=new Set(G.autoUpgrades.filter(k=>k.startsWith('slot:')));
  return options.filter(a=>!explicit.has(a.key)).sort((a,b)=>a.level-b.level);
}
function autoUpgradeComplete(key){
  const [kind,section,id]=key.split(':');
  const options=upgradeOptions(section,kind==='slot').filter(a=>kind==='section'||a.id===id);
  return !options.length||options.every(a=>a.level>=a.max);
}
function pruneAutoUpgrades(){
  if(!G)return;
  G.autoUpgrades=(G.autoUpgrades||[]).filter((key,index,all)=>all.indexOf(key)===index&&!autoUpgradeComplete(key));
  G.dr.auto=G.autoUpgrades.includes('slot:inventory:egg');
}
function setAutoUpgrade(key,checked){
  if(!G)return;
  if(checked){if(!G.autoUpgrades.includes(key)&&!autoUpgradeComplete(key))G.autoUpgrades.push(key)}
  else G.autoUpgrades=G.autoUpgrades.filter(k=>k!==key);
  pruneAutoUpgrades();refreshAutoUpgradeUi();
}
function makeAutoUpgradeControl(key,header=false){

  const input=document.createElement('input');input.type='checkbox';input.setAttribute('aria-label',header?'Mejorar sección automáticamente':'Mejorar casilla automáticamente');
  const rank=document.createElement('b');
  label.appendChild(input);label.appendChild(rank);
  if(header){const text=document.createElement('span');text.textContent='Mejorar auto';label.appendChild(text)}
  label.onclick=event=>event.stopPropagation();
  input.onchange=()=>setAutoUpgrade(key,input.checked);

function buildAutoUpgradeHeaders(){

function refreshAutoUpgradeUi(){
  if(!G)return;
  for(const [key,control] of autoUpgradeControls){
    const priority=G.autoUpgrades.indexOf(key)+1;
    control.input.checked=priority>0;control.input.disabled=autoUpgradeComplete(key);

}
function autoUpgradeWallet(option){const m=/^pending(\d)$/.exec(option.wallet||'');if(m)return heroPend(+m[1]-1);return option.wallet?G[option.wallet]:0}
function runAutoUpgrades(budget=16){
  if(!shopOk()||(G.paused&&G.modal!=='round')||!G.autoUpgrades.length)return 0;
  let purchases=0;AUTO_UPGRADE_BUSY=true;
  try{
    pruneAutoUpgrades();
    while(purchases<budget){
      let bought=false;
      for(const key of G.autoUpgrades){
        const candidate=autoUpgradeCandidates(key).find(a=>a.level<a.max&&a.available&&(autoUpgradeWallet(a)>0||G.gold>=a.cost));
        if(!candidate)continue;
        const mode=autoUpgradeWallet(candidate)>0?'pt':'gold';
        if(candidate.run(mode)){purchases++;bought=true;pruneAutoUpgrades();break}
      }
      if(!bought)break;
    }
  }finally{AUTO_UPGRADE_BUSY=false}
  if(purchases)refreshAll();else refreshAutoUpgradeUi();
  return purchases;
}
function updateAutoUpgrades(dt){
  G.autoUpgradeTimer-=dt;if(G.autoUpgradeTimer>0)return;

  if(n.allies)t.push('esqueletos aliados');

function spawnSoloEnemies(count=1,boss=false){
  if(!G.solo)return;

  const room=Math.max(0,4-G.enemies.filter(e=>!e.dead).length);
  const weak=EN.find(e=>e.n==='Goblin');
  for(let i=0;i<Math.min(count,room);i++){
    const a=Math.random()*Math.PI*2,r=240+Math.random()*60;
    spawnEnemy(false,weak,{x:cx()+Math.cos(a)*r,y:cy()+Math.sin(a)*r,hpAbs:30,dmg:1,sp:42,r:12,xp:1,gold:0});
    const e=G.enemies.at(-1);e.n='Goblin de práctica';e.res={};

/* ============ RONDAS ============
   El juego se divide en rondas de 3 a 4 minutos (pruebas). Entre rondas el juego se detiene y es el único momento
   en que se gastan puntos, experiencia y oro. */
const ROUND_MIN=180,ROUND_MAX=240;
const roundLen=n=>Math.min(ROUND_MAX,ROUND_MIN+5*(n-1));
const roundCleared=()=>!!G.rounds&&G.roundT>=G.roundLen&&!G.enemies.some(e=>!e.dead);
const shopOk=()=>!!G&&!G.over&&(G.rounds?G.modal==='round':!G.modal);
function beginRounds(){G.rounds=true;G.round=1;G.roundT=0;G.roundLen=roundLen(1);openRest(0)}
function endRound(){
  if(G.over||!roundCleared())return false;
  const done=G.round;
  G.enemies=[];G.eshots=[];G.projs=[];
  G.round++;
  openRest(done);
  return true;
}
const setResting=v=>{if(typeof document!=='undefined'&&document.body&&document.body.classList)document.body.classList.toggle('resting',v)};
function openRest(done){
  G.modal='round';G.paused=true;G.drawerPause=false;
  for(const i of HIDX())heroCtx(i,()=>{if(G.dead)heroRevive();G.hp=S.maxHp});
  for(const o of aliveTowers())o.u.hp=towerMax(uLvl(o.u));
  runAutoUpgrades(64);refreshAll();
  setResting(true);if(window.openRestDrawer)window.openRestDrawer();
  const len=roundLen(G.round),m=Math.floor(len/60),sc=len%60;
  $('#roundbar').style.display='block';
  $('#roundbar').innerHTML='<b style="font-size:17px">'+(done?'✅ Ronda '+done+' superada':'🛡️ Prepárate')+'</b>'+
    '<div class="sub" style="margin:6px 0">Gasta tu experiencia y tu oro en el panel inferior: las mejoras solo se compran entre rondas.</div>'+
    '<button class="btn" id="goRound">▶ Empezar ronda '+G.round+' ('+m+':'+String(sc).padStart(2,'0')+') · Enter</button>';
  $('#goRound').onclick=startRound;
}
function startRound(){
  if(!G||G.modal!=='round')return;
  if(window.closeDrawers)window.closeDrawers();
  setResting(false);
  G.modal=null;G.paused=false;G.roundT=0;G.roundLen=roundLen(G.round);
  G.spawnAcc=0;
  for(const [key,delay] of [['nextBoss',45],['nextWave',Math.max(30,55-eT(G.t)/60*2)],['nextSiege',Math.max(45,75-eT(G.t)/60*1.5)]])if(G[key]<=G.t)G[key]=G.t+delay;
  $('#roundbar').style.display='none';
}

function invTarget(R,x0,y0){
  let b=null,bs=-1;
  for(const e of G.enemies){if(e.dead||e.invT>0)continue;const d=Math.hypot(e.x-x0,e.y-y0);if(d>R+e.r)continue;const s=(e.boss?1e9:e.elite?1e6:0)+e.hp;if(s>bs){bs=s;b=e}}
  return b;
}
function invCluster(R,rad,x0,y0){
  let b=null,bn=0;
  for(const e of G.enemies){if(e.dead||Math.hypot(e.x-x0,e.y-y0)>R)continue;const n=countNear(e.x,e.y,rad);if(n>bn){bn=n;b=e}}
  return b;
}
function invHit(e,d,type,stunS,knock,ang){
  if(e.dead)return;
  dealDamage(e,d,type);
  if(e.dead)return;
  if(stunS)e.stun=Math.max(e.stun||0,e.boss?stunS*.3:stunS);
  if(knock&&!(e.root>0)){const k=e.boss?knock*.2:e.elite?knock*.55:knock;e.x+=Math.cos(ang)*k;e.y+=Math.sin(ang)*k}
}

      if(!e||c.n<=0){c.done=true;continue}

    }
    T.frost=T.frost.filter(c=>!c.done);
  }
  if(T.alacT>0)T.alacT-=dt;

function tick6(h,dt,T,x0,y0,rdy,done,retry){
  const E=E5();let l,f;
  if(h==='shaman'){
    {queueHeroCast(rdy,'c_bolt',()=>{l=clv('c_bolt');f=tf('c_bolt');if((l=clv('c_bolt'))&&rdy('c_bolt')){
      f=tf('c_bolt');const cost=Math.max(4,10-f.scap);
      if((T.static||0)<cost)retry('c_bolt');
      else{
        const cs=nhTargets(x0,y0,rg('c_bolt')).sort((a,b)=>b.hp-a.hp).slice(0,1+f.cnt);
        if(!cs.length)retry('c_bolt');
        else{
          shamanStatic(-cost);
          for(const e of cs){
            const ex=e.x,ey=e.y,wet=e.wetUntil>G.t;
            nhDamage('c_bolt',e,hdmg(l)*6*(wet?1.5:1),'elec');
            for(const o of nhTargets(ex,ey,70).filter(o=>o!==e).slice(0,8))nhDamage('c_bolt',o,hdmg(l)*2,'elec');
            let px=ex+R5(-40,40),py=ey-430;const pts=[[px,py]];
            for(let i=1;i<=5;i++){px=ex+(px-ex)*.55+R5(-18,18);py=ey-430+i*(430/5);pts.push([i===5?ex:px,i===5?ey:py])}
            G.fx.push({k:'bolt',pts,t:.5,c:'#8de9ee'});G.fx.push({k:'bolt',pts,t:.3,c:'#ffffff'});
            ring6(ex,ey,70,'#ffffff',.4);ring6(ex,ey,40,'#8de9ee',.35);
            for(let i=0;i<8;i++)par6(ex,ey,R5(-180,180),R5(-180,60),.45,'#bff6facc');
          }
          txt(x0,y0-80,'🌩️ ¡GOLPE DE RELÁMPAGO!','#8de9ee',20);done('c_bolt',Math.max(8,14-.3*l));
        }

    }});}
    {queueHeroCast(rdy,'c_orb',()=>{l=clv('c_orb');f=tf('c_orb');if((l=clv('c_orb'))&&rdy('c_orb')){
      f=tf('c_orb');const used=[],n=1+f.cnt;let did=0;
      for(let i=0;i<n;i++){
        const b=bestC6(x0,y0,rg('c_bolt')||440,100);if(!b)break;
        if(used.some(u=>Math.hypot(u.x-b.x,u.y-b.y)<80)&&i>0){const alt=G.enemies.find(e=>!e.dead&&Math.hypot(e.x-x0,e.y-y0)<440&&!used.some(u=>Math.hypot(u.x-e.x,u.y-e.y)<80));if(!alt)break;used.push(alt)}
        else used.push(b);
        const tg=used[used.length-1];did++;
        E.push({k:'orb',x:x0,y:y0-14,tx:tg.x,ty:tg.y,rt:.4,tk:.2,t:0,life:(4+.1*l)*f.dur,l,zr:(70+l)*f.rad,draw:drawOrb,upd(o,dt){

          if(o.rt<=0){o.rt=.5;const b2=bestC6(o.x,o.y,420,100);if(b2){o.tx=b2.x;o.ty=b2.y}}
          const dx=o.tx-o.x,dy=o.ty-o.y,d=Math.hypot(dx,dy)||1;
          if(d>14){const s=Math.min(d,130*dt);o.x+=dx/d*s;o.y+=dy/d*s}
          o.tk-=dt;
          if(o.tk<=0){
            o.tk=.35;const ts=nhTargets(o.x,o.y,o.zr).slice(0,12);let n2=0;
            for(const e of ts){nhDamage('c_orb',e,hdmg(o.l)*.6,'elec');if(!e.dead){e.wetUntil=G.t+4;n2++}}
            if(n2)shamanStatic(Math.min(3,n2));
            for(const e of ts.slice(0,3))G.fx.push({k:'bolt',pts:[[o.x,o.y],[e.x,e.y]],t:.15,c:'#8de9ee'});
            ring6(o.x,o.y,o.zr,'#8de9ee',.25);
          }
        }});
      }
      if(!did)retry('c_orb');else{txt(x0,y0-70,'🔵 ¡Bola de relámpago!','#8de9ee',18);done('c_orb',Math.max(10,18-.4*l))}
    }});}
  }
  {queueHeroCast(rdy,'al_gold',()=>{l=clv('al_gold');f=tf('al_gold');if(h==='alchemist'&&(l=clv('al_gold'))&&rdy('al_gold')){
    f=tf('al_gold');const cs=nhTargets(x0,y0,rg('al_gold')).sort((a,b)=>b.hp-a.hp).slice(0,1+Math.floor(l/10)+f.cnt);

    }
  }});}
}

        const n=sk.cnt(l)+f.cnt,dur=(2.5+.05*l)*f.dur;

        c.gaze=Math.max(2,9*f.cd/(S.atk>1?1+(S.atk-1)*.5:1));

          txt(e.x,e.y-e.r-14,'🗿','#cfd3dc',16);
          G.fx.push({k:'bolt',pts:[[c.x,c.y-14],[e.x,e.y]],t:.3,T:.3,c:c.col});
        }
        if(cand.length)G.fx.push({k:'ring',x:c.x,y:c.y,r:34,t:.3,c:c.col});
      }

      const hx=tx+45,hy=ty+30,d=Math.hypot(hx-c.x,hy-c.y);
      if(d>4){const st=Math.min(d,170*dt);c.x+=(hx-c.x)/d*st;c.y+=(hy-c.y)/d*st}
    }
  }
}

function towerGainXp(a){
  const T=G.tower;if(!T||!Number.isFinite(a)||!(a>0))return;
  a*=1+.08*(G.items.core||0);
  /* la XP sube la torre más reciente; el coste crece con el progreso total */
  for(;;){
    const units=towerUnits(),ai=units.length-1,u=units[ai];
    u.xp=(u.xp||0)+a;a=0;
    const need=tNeed(tProgress());
    if(u.xp<need)break;
    u.xp-=need;a=u.xp;u.xp=0;u.lvl=uLvl(u)+1;
    const mx=towerMax(u.lvl);if(!u.dead)u.hp=Math.min(mx,(u.hp==null?mx:u.hp)+100+mx*.06);
    if(ai===0)syncSkillLevels();
    const P=tProgress(),tx=towX(ai),ty=towY(ai);
    txt(tx,ty-80,'🗼 ¡Torre Nv '+u.lvl+'!','#9fd0ff',20);
    for(let k=0;k<3;k++)G.fx.push({k:'ring',x:tx,y:ty,r:50+k*28,t:.45+k*.1,c:'#9fd0ff'});
    if(u.lvl>=TOWER_MAXLVL){
      T.satellites=T.satellites||[];T.satellites.push({lvl:1,xp:0,cd:.5,shotAt:-9,aim:0,hp:towerMax(1),dead:false});
      const pos=towerPosition(towerUnits().length-1);txt(pos.x,pos.y-100,'¡Nueva torre arcana!','#ffd24a',22);G.fx.push({k:'ring',x:pos.x,y:pos.y,r:90,t:.8,c:'#9fd0ff'});
    }
    if(!(a>0))break;
  }
}

function drawHeroBar(){

  ctx.fillStyle='#000a';ctx.fillRect(x-w/2,y,w,5);ctx.fillStyle=f<.3?'#e04050':'#4ac26a';ctx.fillRect(x-w/2,y,w*f,5);
  if(G.shield>0){ctx.fillStyle='#7fd6ff';ctx.fillRect(x-w/2,y-2,w*Math.min(1,G.shield/S.maxHp),2)}
}
function heroCtx(i,fn){
  if(!G||!G.hl||i===HCUR||!G.hl[i])return fn();
  const p=HCUR;
  saveH(p);loadH(i);HCUR=i;
  try{return fn()}finally{saveH(i);loadH(p);HCUR=p}
}
const heroPos=i=>{if(i===HCUR)return{x:cx(),y:cy()};const t=G.hl[i];return{x:W/2+t.hoff+t.bx,y:H/2+t.by}};
const midPos=()=>{const ps=HIDX().map(heroPos);return{x:ps.reduce((n,q)=>n+q.x,0)/ps.length,y:ps.reduce((n,q)=>n+q.y,0)/ps.length}};
/* el daño lo recibe el héroe al que atacó el enemigo */
{const _h=hurt;hurt=function(d){if(G.hl&&HCUR===0&&G.tgtHero>0)return heroCtx(G.tgtHero,()=>_h(d));return _h(d)}}
/* eventos de baja y de impacto: los reciben ambos héroes */
{const _k=heroOnKill;heroOnKill=function(e){_k(e);if(G.hl)for(const i of HIDX())if(i!==HCUR)heroCtx(i,()=>_k(e))}}
{const _n=newHeroesHit;newHeroesHit=function(p,e){if(G.hl&&p.nh){const o=Math.max(0,G.heroes.indexOf(p.nh));return heroCtx(o,()=>_n(p,e))}return _n(p,e)}}
{const r0=loadRank();best=r0.length?r0[0].t:0}
resize();buildShop();buildSkillsMenu();buildAutoUpgradeHeaders();buildBar();buildRankBtn();buildTabs();setupDrawers();setupTip();
{let z=NaN;try{z=parseFloat(localStorage.getItem('mago_zoom'))}catch(e){}if(z)Z=Math.max(.5,Math.min(1.8,z));else if(typeof innerWidth!=='undefined'&&innerWidth<700)Z=.7}
newGame();showStart();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>resize()).observe($('#game'));
setTimeout(resize,60);
requestAnimationFrame(t=>{last=t;frame(t)});
</script>
